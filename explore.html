<!------------------------------>
<!-- explore.html -->
<!------------------------------>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  
  <!-- === CONFIGURATION PWA & iOS === -->
  <meta name="theme-color" content="#1B241F">
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SegSeq">
  <link rel="apple-touch-icon" href="icon-192.png">
  <!-- =============================== -->

  <title class="lang-element" data-en="SegSeq - Explore Challenges" data-fr="SegSeq - Explorer les défis">SegSeq - Explore Challenges</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  
  <style>
    /* Styles spécifiques à la page Explore (Adaptés au thème sombre) */
    .pagination-controls { display: flex; justify-content: center; align-items: center; gap: 15px; margin-top: 40px; }
    .btn-page { background: rgba(255,255,255,0.1); color: var(--color-text-main); border: 1px solid rgba(255,255,255,0.05); padding: 10px 20px; border-radius: 12px; cursor: pointer; font-weight: 600; transition: all 0.2s ease; }
    .btn-page:hover:not(:disabled) { background: rgba(255,255,255,0.2); }
    .btn-page:disabled { opacity: 0.3; cursor: not-allowed; }
    
    .challenge-card-inner { display: flex; gap: 20px; align-items: center; width: 100%; }
    .challenge-img { width: 120px; height: 120px; object-fit: cover; border-radius: 16px; flex-shrink: 0; border: 1px solid rgba(255,255,255,0.1); }
    .challenge-details { flex: 1; display: flex; justify-content: space-between; align-items: center; gap: 20px; }
    .challenge-info { flex: 1; }
    .challenge-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
    
    .sport-tags { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
    .sport-tag { background: rgba(255,255,255,0.05); color: var(--color-text-muted); font-size: 0.8rem; padding: 6px 12px; border-radius: 8px; font-weight: 600; border: 1px solid rgba(255,255,255,0.05); }
    
    @media (max-width: 600px) {
      .challenge-card-inner { flex-direction: column; align-items: flex-start; }
      .challenge-img { width: 100%; height: 180px; }
      .challenge-details { flex-direction: column; align-items: flex-start; width: 100%; }
      .challenge-actions { width: 100%; justify-content: flex-start; margin-top: 10px; }
    }
  </style>
</head>
<body>
  <div id="header-placeholder"></div>

  <div class="container" style="max-width:900px; margin: 0 auto;">
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-value" id="stat-athletes">-</div>
        <div class="stat-label lang-element" data-en="Registered Athletes" data-fr="Athlètes Inscrits">Registered Athletes</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="stat-challenges">-</div>
        <div class="stat-label lang-element" data-en="Created Challenges" data-fr="Défis Créés">Created Challenges</div>
      </div>
    </div>

    <!-- Barre de contrôles (Recherche, Filtre Sport & Tri) -->
    <div style="display: flex; gap: 15px; margin-bottom: 30px; flex-wrap: wrap;">
      <input type="text" id="search-input" class="lang-element" data-placeholder-en="Search by name..." data-placeholder-fr="Rechercher par nom..." placeholder="Search by name..." style="flex: 2; min-width: 200px; margin-top: 0;">
      
      <select id="sport-select" style="flex: 1; min-width: 150px; margin-top: 0; cursor: pointer;">
        <option value="all" class="lang-element" data-en="All Sports" data-fr="Tous les sports">All Sports</option>
        <option value="run" class="lang-element" data-en="Running" data-fr="Course à pied">Running</option>
        <option value="ride" class="lang-element" data-en="Cycling" data-fr="Vélo">Cycling</option>
        <option value="multi" class="lang-element" data-en="Multisport" data-fr="Multisports">Multisport</option>
      </select>

      <select id="sort-select" style="flex: 1; min-width: 150px; margin-top: 0; cursor: pointer;">
        <option value="newest" class="lang-element" data-en="Sort: Newest first" data-fr="Tri : Plus récents">Sort: Newest first</option>
        <option value="name" class="lang-element" data-en="Sort: Name (A-Z)" data-fr="Tri : Nom (A-Z)">Sort: Name (A-Z)</option>
        <option value="duration" class="lang-element" data-en="Sort: Duration (Shortest)" data-fr="Tri : Durée (Plus courte)">Sort: Duration (Shortest)</option>
      </select>
    </div>

    <div class="challenge-list" id="challenges-container">
      <p style="text-align: center; color: var(--color-text-muted);" class="lang-element" data-en="Loading challenges..." data-fr="Chargement des défis...">Loading challenges...</p>
    </div>

    <!-- Pagination -->
    <div class="pagination-controls" id="pagination-controls" style="display: none;">
      <button class="btn-page lang-element" data-en="Previous" data-fr="Précédent" id="btn-prev" onclick="changePage(-1)">Previous</button>
      <span id="page-info" style="font-weight: 600; color: var(--color-text-main);">1 / 1</span>
      <button class="btn-page lang-element" data-en="Next" data-fr="Suivant" id="btn-next" onclick="changePage(1)">Next</button>
    </div>
  </div>

  <div id="footer-placeholder"></div>
  <script src="app.js"></script> 
  
  <script>
    let allChallenges = [];
    let filteredChallenges = [];
    let currentPage = 1;
    const itemsPerPage = 10;

    async function loadChallenges() {
      const container = document.getElementById("challenges-container");
      const lang = localStorage.getItem('userLang') || 'en';
      
      try {
        const res = await fetch("/api/challenges", { credentials: "include" });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Failed to load");
        
        allChallenges = data; 
        applySearchAndSort(); 
      } catch (err) {
        container.innerHTML = `<p style="text-align: center; color: var(--danger);">${lang === 'fr' ? "Erreur de chargement." : "Error loading."}</p>`;
      }
    }

    function applySearchAndSort() {
      const searchTerm = document.getElementById('search-input').value.toLowerCase();
      const sortValue = document.getElementById('sort-select').value;
      const sportValue = document.getElementById('sport-select').value;
      
      filteredChallenges = allChallenges.filter(c => {
        const matchName = c.name.toLowerCase().includes(searchTerm);
        
        let sports = c.sports || [];
        if (sports.length === 0 && c.segments) {
          sports = [...new Set(c.segments.map(s => (s.activity_type || s.sport || '').toLowerCase()))];
        } else {
          sports = sports.map(s => s.toLowerCase());
        }

        let matchSport = true;
        const isMulti = sports.length >= 2;
        
        if (sportValue === 'run') matchSport = sports.includes('run');
        else if (sportValue === 'ride') matchSport = sports.includes('ride');
        else if (sportValue === 'multi') matchSport = isMulti;

        return matchName && matchSport;
      });

      filteredChallenges.sort((a, b) => {
        if (sortValue === 'newest') return b.id - a.id;
        if (sortValue === 'name') return a.name.localeCompare(b.name);
        if (sortValue === 'duration') return a.duration_hours - b.duration_hours;
        return 0;
      });

      currentPage = 1; 
      renderPaginatedChallenges();
    }

    function changePage(delta) {
      currentPage += delta;
      renderPaginatedChallenges();
    }

    function renderPaginatedChallenges() {
      const lang = localStorage.getItem('userLang') || 'en';
      const container = document.getElementById("challenges-container");
      const pagination = document.getElementById("pagination-controls");
      
      if (filteredChallenges.length === 0) {
        container.innerHTML = `<p style="text-align: center; color: var(--color-text-muted);">${lang === 'fr' ? "Aucun défi trouvé." : "No challenges found."}</p>`;
        pagination.style.display = "none";
        return;
      }
      
      const totalPages = Math.ceil(filteredChallenges.length / itemsPerPage);
      const start = (currentPage - 1) * itemsPerPage;
      const paginatedData = filteredChallenges.slice(start, start + itemsPerPage);
      
      container.innerHTML = "";
      
      paginatedData.forEach(challenge => {
        const card = document.createElement("div");
        card.className = "challenge-card";
        
        // Bouton ~ centralisé
        let actionsHtml = `<a href="challenge.html?id=${challenge.id}" class="btn-view-feature" title="${lang === 'fr' ? 'Voir' : 'View'}"><span class="icon">∿</span></a>`;
        
        // Boutons admin/édition
        if (challenge.can_delete) {
          actionsHtml += `
            <a href="create.html?edit=${challenge.id}" class="btn" style="background: rgba(255,255,255,0.1); color: var(--color-text-main); padding: 0 15px; height: 44px;">${lang === 'fr' ? 'Modifier' : 'Edit'}</a>
            <button onclick="deleteChallenge(${challenge.id})" class="btn-delete" style="padding: 0 15px; height: 44px;">${lang === 'fr' ? 'Supprimer' : 'Delete'}</button>
          `;
        }

        let sports = challenge.sports || [];
        if (sports.length === 0 && challenge.segments) {
          sports = [...new Set(challenge.segments.map(s => s.activity_type || s.sport || 'Unknown'))];
        }
        const tagsHtml = sports.map(s => {
          let sName = s;
          if (lang === 'fr') {
            if (s.toLowerCase() === 'run') sName = 'Course';
            if (s.toLowerCase() === 'ride') sName = 'Vélo';
          }
          return `<span class="sport-tag">${sName}</span>`;
        }).join('');

        const imgHtml = challenge.image_url 
          ? `<img src="${challenge.image_url}" class="challenge-img" alt="Challenge Image">` 
          : '';

        card.innerHTML = `
          <div class="challenge-card-inner">
            ${imgHtml}
            <div class="challenge-details">
              <div class="challenge-info">
                <h3 style="color: var(--color-text-main); font-size: 1.4rem; margin-bottom: 8px;">${challenge.name}</h3>
                <p style="color: var(--color-text-muted); font-size: 0.95rem; margin-bottom: 12px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">${challenge.description || ''}</p>
                <p style="color: var(--color-text-muted); margin-bottom: 10px;"><strong style="color: var(--color-text-main);">${lang === 'fr' ? 'Durée :' : 'Duration:'}</strong> ${challenge.duration_hours}h</p>
                <div class="sport-tags">${tagsHtml}</div>
              </div>
              <div class="challenge-actions">
                ${actionsHtml}
              </div>
            </div>
          </div>
        `;
        container.appendChild(card);
      });

      document.getElementById("page-info").textContent = `${currentPage} / ${totalPages}`;
      document.getElementById("btn-prev").disabled = currentPage === 1;
      document.getElementById("btn-next").disabled = currentPage === totalPages;
      pagination.style.display = totalPages > 1 ? "flex" : "none";
    }

    document.getElementById('search-input').addEventListener('input', applySearchAndSort);
    document.getElementById('sort-select').addEventListener('change', applySearchAndSort);
    document.getElementById('sport-select').addEventListener('change', applySearchAndSort);

    async function deleteChallenge(id) {
      const lang = localStorage.getItem('userLang') || 'en';
      if (!confirm(lang === 'fr' ? "Êtes-vous sûr ?" : "Are you sure?")) return;
      
      try {
        const res = await fetch(`/api/challenges?id=${id}`, { method: "DELETE", credentials: "include" });
        if (res.ok) {
          allChallenges = allChallenges.filter(c => c.id !== id);
          applySearchAndSort();
        } else {
          const data = await res.json();
          alert((lang === 'fr' ? "Erreur : " : "Error: ") + data.error);
        }
      } catch (err) { alert(lang === 'fr' ? "Erreur réseau." : "Network error."); }
    }

    async function loadStats() {
      try {
        const res = await fetch("/api/stats");
        if (res.ok) {
          const data = await res.json();
          document.getElementById("stat-athletes").textContent = data.athletes;
          document.getElementById("stat-challenges").textContent = data.challenges;
        }
      } catch (err) {}
    }

    loadStats();
    loadChallenges();
  </script>
</body>
</html>
