<!------------------------------>
<!-- explore.html -->
<!------------------------------>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  
  <!-- === CONFIGURATION PWA & iOS === -->
  <meta name="theme-color" content="#1B241F">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SegSeq">
  <link rel="apple-touch-icon" href="icon-192.png">
  <!-- =============================== -->

  <title class="lang-element" data-en="SegSeq - Explore Challenges" data-fr="SegSeq - Explorer les défis">SegSeq - Explore Challenges</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  
</head>
<body>
  <div id="header-placeholder"></div>

  <div class="container" style="max-width:900px; margin: 0 auto;">
    <!-- DÉBUT : Statistiques globales (Admin Only) -->
    <div class="admin-feature">
      <div class="stats-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-bottom: 30px;">
        <div class="stat-card">
          <div class="stat-value" id="stat-athletes">-</div>
          <div class="stat-label lang-element" data-en="Registered Athletes" data-fr="Athlètes Inscrits">Registered Athletes</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="stat-challenges">-</div>
          <div class="stat-label lang-element" data-en="Created Challenges" data-fr="Défis Créés">Created Challenges</div>
        </div>
      </div>
    </div>
    <!-- FIN : Statistiques globales -->


    <!-- Barre de contrôles (Recherche, Filtre Sport & Tri) -->
    <div style="display: flex; gap: 15px; margin-bottom: 30px; flex-wrap: wrap;">
      <input type="text" id="search-input" class="lang-element" data-placeholder-en="Search by name..." data-placeholder-fr="Rechercher par nom..." placeholder="Search by name..." style="flex: 2; min-width: 200px; margin-top: 0;">
      
      <!-- Filtre multi-sport ne marche pas... on lenleve temproairement 
	  <select id="sport-select" style="flex: 1; min-width: 150px; margin-top: 0; cursor: pointer;">
        <option value="all" class="lang-element" data-en="All Sports" data-fr="Tous les sports">All Sports</option>
        <option value="run" class="lang-element" data-en="Running" data-fr="Course à pied">Running</option>
        <option value="ride" class="lang-element" data-en="Cycling" data-fr="Vélo">Cycling</option>
        <option value="multi" class="lang-element" data-en="Multisport" data-fr="Multisports">Multisport</option>
      </select> -->

      <select id="sort-select" style="flex: 1; min-width: 150px; margin-top: 0; cursor: pointer;">
        <option value="newest" class="lang-element" data-en="Sort: Newest first" data-fr="Tri : Plus récents">Sort: Newest first</option>
        <option value="name" class="lang-element" data-en="Sort: Name (A-Z)" data-fr="Tri : Nom (A-Z)">Sort: Name (A-Z)</option>
        <option value="duration" class="lang-element" data-en="Sort: Duration (Shortest)" data-fr="Tri : Durée (Plus courte)">Sort: Duration (Shortest)</option>
      </select>
    </div>

    <div class="explore-grid" id="challenges-container">
      <p style="text-align: center; color: var(--color-text-muted);" class="lang-element" data-en="Loading challenges..." data-fr="Chargement des défis...">Loading challenges...</p>
    </div>

   <!-- Pagination -->
    <div class="pagination-controls" id="pagination-controls" style="display: none;">
      <button class="btn-page lang-element" data-title-en="Previous" data-title-fr="Précédent" id="btn-prev" onclick="changePage(-1)" style="padding: 0; width: 44px; height: 44px; display: flex; justify-content: center; align-items: center;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>
      
      <span id="page-info" style="font-weight: 600; color: var(--color-text-main);">1 / 1</span>
      
      <button class="btn-page lang-element" data-title-en="Next" data-title-fr="Suivant" id="btn-next" onclick="changePage(1)" style="padding: 0; width: 44px; height: 44px; display: flex; justify-content: center; align-items: center;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </button>
    </div>
  </div>

  <div id="footer-placeholder"></div>
  <script src="app.js"></script> 
  
  <script>
    let allChallenges = [];
    let filteredChallenges = [];
    let currentPage = 1;
    const itemsPerPage = 10;

    async function loadChallenges() {
      const container = document.getElementById("challenges-container");
      const lang = localStorage.getItem('userLang') || 'en';
      
      try {
        const res = await fetch("/api/challenges", { credentials: "include" });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Failed to load");
        
        allChallenges = data; 
        applySearchAndSort(); 
      } catch (err) {
        container.innerHTML = `<p style="text-align: center; color: var(--danger);">${lang === 'fr' ? "Erreur de chargement." : "Error loading."}</p>`;
      }
    }

function applySearchAndSort() {
      const searchTerm = document.getElementById('search-input').value.toLowerCase();
      const sortValue = document.getElementById('sort-select').value;
      
      // On ne filtre plus que sur le nom
      filteredChallenges = allChallenges.filter(c => {
        return c.name.toLowerCase().includes(searchTerm);
      });

      // Le tri reste identique
      filteredChallenges.sort((a, b) => {
        if (sortValue === 'newest') return b.id - a.id;
        if (sortValue === 'name') return a.name.localeCompare(b.name);
        if (sortValue === 'duration') return a.duration_hours - b.duration_hours;
        return 0;
      });

      currentPage = 1; 
      renderPaginatedChallenges();
    }


    function changePage(delta) {
      currentPage += delta;
      renderPaginatedChallenges();
    }

    function renderPaginatedChallenges() {
      const lang = localStorage.getItem('userLang') || 'en';
      const container = document.getElementById("challenges-container");
      const pagination = document.getElementById("pagination-controls");
      
      if (filteredChallenges.length === 0) {
        container.innerHTML = `<p style="text-align: center; color: var(--color-text-muted);">${lang === 'fr' ? "Aucun défi trouvé." : "No challenges found."}</p>`;
        pagination.style.display = "none";
        return;
      }
      
      const totalPages = Math.ceil(filteredChallenges.length / itemsPerPage);
      const start = (currentPage - 1) * itemsPerPage;
      const paginatedData = filteredChallenges.slice(start, start + itemsPerPage);
      
      container.innerHTML = "";
      
      paginatedData.forEach(challenge => {
        const card = document.createElement("div");
        card.className = "challenge-card";
        
        // Bouton ~ centralisé
        let actionsHtml = ``;
        
        // Remplacement des boutons grossiers par des icônes SVG
        if (challenge.can_delete) {
          actionsHtml += `
            <div class="action-icons">
              <a href="create.html?edit=${challenge.id}" class="icon-btn" title="${lang === 'fr' ? 'Modifier' : 'Edit'}">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
              </a>
              <button onclick="deleteChallenge(${challenge.id})" class="icon-btn delete" title="${lang === 'fr' ? 'Supprimer' : 'Delete'}">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
              </button>
            </div>
          `;
        }

        // Affichage robuste des sports
        let sportsList = [];
        if (Array.isArray(challenge.sports)) sportsList = challenge.sports;
        else if (typeof challenge.sports === 'string') sportsList = challenge.sports.split(',');
        else if (challenge.segments) sportsList = challenge.segments.map(s => s.activity_type || s.sport || 'Unknown');
        
        const sports = [...new Set(sportsList.map(s => s.trim()))];

        const tagsHtml = sports.map(s => {
          let sName = s;
          if (lang === 'fr') {
            if (s.toLowerCase().includes('run')) sName = 'Course';
            if (s.toLowerCase().includes('ride') || s.toLowerCase().includes('cycl')) sName = 'Vélo';
          }
          return `<span class="sport-tag">${sName}</span>`;
        }).join('');

         // 1. Formatage élégant du Sport
        let displaySport = "Multi-sports";
        if (sports.length === 1 && sports[0] !== 'Unknown') {
          let s = sports[0].toLowerCase();
          if (lang === 'fr') {
            if (s.includes('run')) displaySport = 'Course';
            else if (s.includes('ride') || s.includes('cycl')) displaySport = 'Vélo';
            else displaySport = s.charAt(0).toUpperCase() + s.slice(1);
          } else {
            displaySport = s.charAt(0).toUpperCase() + s.slice(1);
          }
        }

        // 2. L'image (si elle existe)
        const imgHtml = challenge.image_url 
          ? `<a href="challenge.html?id=${challenge.id}" style="display: block; margin-bottom: 15px; flex-shrink: 0;">
               <img src="${challenge.image_url}" alt="Challenge Image" style="width: 100%; height: 180px; object-fit: cover; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); transition: opacity 0.2s;" onmouseover="this.style.opacity='0.8'" onmouseout="this.style.opacity='1'">
             </a>` 
          : ``;

        // 3. Le Layout Final (Titre -> Description -> Image -> Footer)
        card.innerHTML = `
          <div style="display: flex; flex-direction: column; height: 100%;">
            
            <!-- En-tête : Titre & Actions -->
            <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 10px;">
              <h3 style="font-size: 1.25rem; margin: 0; line-height: 1.3; font-weight: 700; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word;">
                <a href="challenge.html?id=${challenge.id}" style="color: var(--color-text-main); text-decoration: none; transition: color 0.2s;" onmouseover="this.style.color='var(--color-accent)'" onmouseout="this.style.color='var(--color-text-main)'">
                  ${challenge.name}
                </a>
              </h3>
              <div style="display: flex; gap: 8px; flex-shrink: 0;">
                ${actionsHtml}
              </div>
            </div>

            <!-- Description (Tronquée à 2 lignes) -->
            <p style="color: var(--color-text-muted); font-size: 0.9rem; line-height: 1.5; margin-bottom: 15px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">
              ${challenge.description || (lang === 'fr' ? 'Aucune description.' : 'No description.')}
            </p>

            <!-- Image -->
            ${imgHtml}

            <!-- Espace flexible pour toujours pousser le footer tout en bas -->
            <div style="flex-grow: 1;"></div>

            <!-- Footer : Segments • Sport • Durée -->
            <div style="border-top: 1px solid rgba(255,255,255,0.05); padding-top: 12px; margin-top: auto;">
              <div style="color: var(--color-text-muted); font-size: 0.85rem; font-weight: 600; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">
                <span>${challenge.segment_count || 0} Segments</span>
                <span style="opacity: 0.4;">•</span>
                <span style="color: var(--color-accent);">${displaySport}</span>
                <span style="opacity: 0.4;">•</span>
                <span>⏱ ${challenge.duration_hours}h</span>
              </div>
            </div>

          </div>
        `;

        // 3. Le Layout "Premium" (Titre -> Métadonnées -> Image -> Description)
        card.innerHTML = `
          <div style="display: flex; flex-direction: column; height: 100%;">
            
            <!-- En-tête : Titre & Actions -->
            <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 8px;">
              <h3 style="font-size: 1.3rem; margin: 0; line-height: 1.3; font-weight: 700; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">
                <a href="challenge.html?id=${challenge.id}" style="color: var(--color-text-main); text-decoration: none; transition: color 0.2s;" onmouseover="this.style.color='var(--color-accent)'" onmouseout="this.style.color='var(--color-text-main)'">
                  ${challenge.name}
                </a>
              </h3>
              <div style="display: flex; gap: 8px; flex-shrink: 0;">
                ${actionsHtml}
              </div>
            </div>

            <!-- Ligne de Métadonnées (Segments • Sport • Durée) -->
            <div style="color: var(--color-text-muted); font-size: 0.85rem; font-weight: 600; margin-bottom: 15px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap;">
              <span>${challenge.segment_count || 0} Segments</span>
              <span style="opacity: 0.4;">•</span>
              <span style="color: var(--color-accent);">${displaySport}</span>
              <span style="opacity: 0.4;">•</span>
              <span>⏱ ${challenge.duration_hours}h</span>
            </div>

            <!-- Image -->
            ${imgHtml}

            <!-- Description (Fluide en bas) -->
            <p style="color: var(--color-text-muted); font-size: 0.95rem; line-height: 1.5; margin-bottom: 0; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; flex-grow: 1;">
              ${challenge.description || ''}
            </p>

          </div>
        `;

        // 2. Le nouveau Layout Vertical (Uniformisé et Responsive)
        card.innerHTML = `
          <div style="display: flex; flex-direction: column; height: 100%;">
            
            <!-- En-tête : Titre à gauche, Boutons d'action à droite (Hauteur fixe pour alignement) -->
            <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 15px; min-height: 55px;">
              <h3 style="font-size: 1.25rem; margin: 0; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word;">
                <a href="challenge.html?id=${challenge.id}" style="color: var(--color-text-main); text-decoration: none; transition: color 0.2s;" onmouseover="this.style.color='var(--color-accent)'" onmouseout="this.style.color='var(--color-text-main)'">
                  ${challenge.name}
                </a>
              </h3>
              <div style="display: flex; gap: 8px; flex-shrink: 0;">
                ${actionsHtml}
              </div>
            </div>

            <!-- Image (Pleine largeur ou Placeholder) -->
            ${imgHtml}

            <!-- Tags des Sports -->
            <div class="sport-tags" style="margin-bottom: 12px; margin-top: 0;">
              ${tagsHtml}
            </div>

            <!-- Description (Limitée à 2 lignes) -->
            <p style="color: var(--color-text-muted); font-size: 0.9rem; margin-bottom: 20px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; flex-grow: 1;">
              ${challenge.description || ''}
            </p>

            <!-- Footer : Durée (Toujours poussé en bas) -->
            <div style="border-top: 1px solid rgba(255,255,255,0.05); padding-top: 15px; margin-top: auto;">
              <p style="color: var(--color-text-muted); margin: 0; font-size: 0.9rem;">
                <strong style="color: var(--color-text-main);">${lang === 'fr' ? 'Durée :' : 'Duration:'}</strong> ${challenge.duration_hours}h
              </p>
            </div>

          </div>
        `;

        container.appendChild(card);


      });

      document.getElementById("page-info").textContent = `${currentPage} / ${totalPages}`;
      document.getElementById("btn-prev").disabled = currentPage === 1;
      document.getElementById("btn-next").disabled = currentPage === totalPages;
      pagination.style.display = totalPages > 1 ? "flex" : "none";
    }

    document.getElementById('search-input').addEventListener('input', applySearchAndSort);
    document.getElementById('sort-select').addEventListener('change', applySearchAndSort);

    async function deleteChallenge(id) {
      const lang = localStorage.getItem('userLang') || 'en';
      if (!confirm(lang === 'fr' ? "Êtes-vous sûr ?" : "Are you sure?")) return;
      
      try {
        const res = await fetch(`/api/challenges?id=${id}`, { method: "DELETE", credentials: "include" });
        if (res.ok) {
          allChallenges = allChallenges.filter(c => c.id !== id);
          applySearchAndSort();
        } else {
          const data = await res.json();
          alert((lang === 'fr' ? "Erreur : " : "Error: ") + data.error);
        }
      } catch (err) { alert(lang === 'fr' ? "Erreur réseau." : "Network error."); }
    }

    async function loadStats() {
      try {
        const res = await fetch("/api/stats");
        if (res.ok) {
          const data = await res.json();
          document.getElementById("stat-athletes").textContent = data.athletes;
          document.getElementById("stat-challenges").textContent = data.challenges;
        }
      } catch (err) {}
    }

    loadStats();
    loadChallenges();
  </script>
</body>
</html>
