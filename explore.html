<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SegSeq - Explore Challenges</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="header-placeholder"></div>

  <div class="container" style="max-width:900px;">
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-value" id="stat-athletes">-</div>
        <div class="stat-label">Athlètes Inscrits</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="stat-challenges">-</div>
        <div class="stat-label">Challenges Créés</div>
      </div>
    </div>

    <div class="challenge-list" id="challenges-container">
      <p style="text-align: center;">Loading challenges...</p>
    </div>

    <div class="cta">
      <a href="Create.html" class="btn btn-primary">Create a challenge</a>
    </div>
  </div>

  <div id="footer-placeholder"></div>

  <script src="components.js"></script>
  <script>
    async function loadChallenges() {
      const container = document.getElementById("challenges-container");
      try {
        const res = await fetch("/api/segseq/challenge", { credentials: "include" });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Failed to load");
        
        if (data.length === 0) {
          container.innerHTML = `<p style="text-align: center;">No challenges found. <a href="Create.html" style="color:var(--orange);">Create one!</a></p>`;
          return;
        }
        
        container.innerHTML = "";
        data.forEach(challenge => {
          const card = document.createElement("div");
          card.className = "challenge-card";
          card.id = `challenge-${challenge.id}`;
          
          let deleteBtnHtml = "";
          if (challenge.can_delete) {
            deleteBtnHtml = `<button onclick="deleteChallenge(${challenge.id})" class="btn-delete">Delete</button>`;
          }
          
          card.innerHTML = `
            <div>
              <h3 style="color: var(--navy); font-size: 1.5rem; margin-bottom: 8px;">${challenge.name}</h3>
              <p style="color: #555;"><strong>Sport:</strong> ${challenge.sport.toUpperCase()} | <strong>Duration:</strong> ${challenge.duration_hours}h</p>
            </div>
            <div style="display: flex; gap: 10px;">
              <a href="Challenge.html?id=${challenge.id}" class="btn-view-feature" style="color: white; background: var(--navy-light); border:none;">View</a>
              ${deleteBtnHtml}
            </div>
          `;
          container.appendChild(card);
        });
      } catch (err) {
        console.error(err);
        container.innerHTML = `<p style="text-align: center; color: red;">Error loading challenges.</p>`;
      }
    }

    async function deleteChallenge(id) {
      if (!confirm("Are you sure you want to delete this challenge? This action cannot be undone.")) return;
      try {
        const res = await fetch(`/api/segseq/challenge?id=${id}`, { method: "DELETE", credentials: "include" });
        const data = await res.json();
        if (res.ok) {
          document.getElementById(`challenge-${id}`).remove();
        } else {
          alert("Error: " + data.error);
        }
      } catch (err) {
        console.error(err);
        alert("Network error occurred.");
      }
    }

    async function loadStats() {
      try {
        const res = await fetch("/api/segseq/stats");
        if (res.ok) {
          const data = await res.json();
          document.getElementById("stat-athletes").textContent = data.athletes;
          document.getElementById("stat-challenges").textContent = data.challenges;
        }
      } catch (err) {
        console.error("Error loading stats:", err);
      }
    }

    loadStats();
    loadChallenges();
  </script>
</body>
</html>
