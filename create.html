<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SegSeq - Create Challenge</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="header-placeholder"></div>

  <div class="container" style="max-width:900px;">
    <div class="form-card">
      <h2>Create a Challenge</h2>
      
      <label>Challenge Name</label>
      <input id="challenge-name" maxlength="40" placeholder="Ex: UTMB 4-Day Challenge">
      
      <label>Description</label>
      <textarea id="description" placeholder="Describe your challenge..." style="min-height:120px; resize:vertical;"></textarea>
      
      <label>Sport</label>
      <select id="sport">
        <option value="run">Running</option>
        <option value="ride">Cycling</option>
      </select>
      
      <label>Duration (hours, max 120)</label>
      <input id="duration" type="number" min="1" max="120" placeholder="48">
      
      <label>Add 2 to 5 Strava segments ID</label>
      <div style="display:flex; align-items:center; gap:12px; margin-top:8px;">
        <input id="segment-input" placeholder="Ex: 1234567" style="flex:1;">
        <button onclick="addSegment()" type="button" style="background:none; border:none; font-size:2rem; color:var(--orange); cursor:pointer; padding:0 10px;">∿</button>
        <span style="color:#777; font-size:.9rem;">Add</span>
      </div>
      
      <div id="segments" style="margin-top: 20px;"></div>
    </div>
    
    <div class="cta">
      <button class="btn btn-primary" onclick="publishChallenge()">Publish challenge</button>
      <a href="Explore.html" class="btn btn-primary" style="margin-left: 10px;">Explore challenges</a>
    </div>
  </div>

  <div id="footer-placeholder"></div>

  <script src="components.js"></script>
  <script>
    let segments = [];

    function addSegment() {
      const input = document.getElementById("segment-input");
      const id = input.value.trim();
      if (!id) return;
      if (segments.length >= 5) {
        alert("Maximum 5 segments");
        return;
      }
      segments.push(id);
      renderSegments();
      input.value = "";
    }

    function removeSegment(index) {
      segments.splice(index, 1);
      renderSegments();
    }

    function renderSegments() {
      const list = document.getElementById("segments");
      list.innerHTML = "";
      segments.forEach((id, i) => {
        const item = document.createElement("div");
        item.className = "segment-item";
        item.innerHTML = `
          <div style="display:flex; align-items:center; gap:12px;">
            <span style="font-size:1.2rem; color:var(--orange);">${i + 1}.</span>
            <span>Segment #${id}</span>
          </div>
          <button onclick="removeSegment(${i})" style="background:none; border:none; color:var(--orange); font-size:1.4rem; cursor:pointer;">×</button>
        `;
        list.appendChild(item);
      });
    }

    async function publishChallenge() {
      const name = document.getElementById("challenge-name").value.trim();
      const description = document.getElementById("description").value.trim();
      const sport = document.getElementById("sport").value.trim();
      const duration = parseInt(document.getElementById("duration").value, 10);
      
      if (segments.length < 2) {
        alert("Tu dois ajouter au moins 2 segments.");
        return;
      }
      
      const payload = { name, description, sport, duration, segments };
      
      try {
        const res = await fetch("/api/segseq/challenges", {
          method: "POST",
          credentials: "include",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        
        if (!res.ok) {
          alert("Erreur: " + data.error);
          return;
        }
        window.location.href = `/Challenge.html?id=${data.id}&autosync=1`;
      } catch (err) {
        console.error(err);
        alert("Erreur réseau");
      }
    }
  </script>
</body>
</html>
