<!------------------------------>
<!-- create.html -->
<!------------------------------>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  
  <!-- === CONFIGURATION PWA & iOS === -->
  <meta name="theme-color" content="#1B241F">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SegSeq">
  <link rel="apple-touch-icon" href="icon-192.png">
  <!-- =============================== -->

  <title class="lang-element" data-en="SegSeq - Create Challenge" data-fr="SegSeq - Créer un défi">SegSeq - Create Challenge</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  
  <style>
    /* Styles spécifiques au Wizard de création (Adaptés au thème sombre) */
    .wizard-step { display: none; animation: fadeIn 0.3s ease; }
    .wizard-step.active { display: block; }
    .wizard-nav { display: flex; justify-content: space-between; margin-top: 30px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.1); }
    .step-indicator { display: flex; gap: 10px; margin-bottom: 30px; justify-content: center; }
    .step-dot { width: 35px; height: 8px; background: rgba(255,255,255,0.2); border-radius: 4px; transition: all 0.3s ease; }
    .step-dot.active { background: var(--color-accent); box-shadow: 0 0 10px rgba(252, 76, 2, 0.4); }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
  <div id="header-placeholder"></div>

  <div class="container" style="max-width:900px; margin: 0 auto;">
    <div class="form-card">
      <h2 class="lang-element" data-en="Create a Challenge" data-fr="Créer un défi" style="margin-bottom: 20px; text-align: center; font-size: 2rem;">Create a Challenge</h2>
      
      <div class="step-indicator">
        <div class="step-dot active" id="dot-1"></div>
        <div class="step-dot" id="dot-2"></div>
        <div class="step-dot" id="dot-3"></div>
      </div>

      <!-- ETAPE 1 : SEGMENTS -->
      <div id="step-1" class="wizard-step active">
        <h3 class="lang-element" data-en="Step 1: Select Segments (2 to 5)" data-fr="Étape 1 : Sélection des segments (2 à 5)" style="margin-bottom: 10px;">Step 1: Select Segments</h3>
        <p class="lang-element" data-en="Virtual or manual activities are not allowed." data-fr="Les activités virtuelles ou manuelles ne sont pas autorisées." style="color: var(--color-text-muted); font-size: 0.95rem; margin-bottom: 20px;">Virtual or manual activities are not allowed.</p>
        
        <div id="segments-list"></div>
        
        <button id="btn-add-row" class="btn-add-row" onclick="addEmptySegment()">
          + <span class="lang-element" data-en="Add another segment" data-fr="Ajouter un autre segment">Add another segment</span>
        </button>
        
        <div class="wizard-nav">
          <button class="btn btn-delete lang-element" data-en="Cancel" data-fr="Annuler" onclick="window.location.href='index.html'">Cancel</button>
          <button class="btn btn-primary lang-element" data-en="Next" data-fr="Suivant" onclick="goToStep(2)">Next</button>
        </div>
      </div>

      <!-- ETAPE 2 : DUREE ET SEQUENCE -->
      <div id="step-2" class="wizard-step">
        <h3 class="lang-element" data-en="Step 2: Rules" data-fr="Étape 2 : Règles" style="margin-bottom: 15px;">Step 2: Rules</h3>
        
        <div class="mobile-stack" style="display: flex; gap: 30px; margin-top: 20px;">
          <div style="flex: 1;">
            <label class="lang-element" data-en="Duration (hours, max 120)" data-fr="Durée (heures, max 120)" style="margin-top: 0;">Duration (hours, max 120)</label>
            <input id="duration" type="number" min="1" max="120" placeholder="48">
          </div>
          <div style="flex: 1; display: flex; align-items: center;">
            <div style="display: flex; align-items: center; gap: 15px; margin-top: 28px;">
              <label class="switch" style="margin: 0; flex-shrink: 0;">
                <input type="checkbox" id="strict-sequence" checked>
                <span class="slider"></span>
              </label>
              <div style="line-height: 1.4;">
                <strong class="lang-element" data-en="Strict sequence" data-fr="Séquence stricte" style="display: block; color: var(--color-text-main);">Strict sequence</strong>
                <small class="lang-element" data-en="Segments must be completed in exact order" data-fr="Les segments doivent être complétés dans l'ordre exact" style="color: var(--color-text-muted);">Segments must be completed in exact order</small>
              </div>
            </div>
          </div>
        </div>
        
        <div class="wizard-nav">
          <button class="btn btn-view-feature lang-element" data-en="Back" data-fr="Précédent" onclick="goToStep(1)">Back</button>
          <button class="btn btn-primary lang-element" data-en="Next" data-fr="Suivant" onclick="goToStep(3)">Next</button>
        </div>
      </div>

      <!-- ETAPE 3 : DETAILS FINAUX -->
      <div id="step-3" class="wizard-step">
        <h3 class="lang-element" data-en="Step 3: Details" data-fr="Étape 3 : Détails" style="margin-bottom: 15px;">Step 3: Details</h3>
        
        <label class="lang-element" data-en="Challenge Name" data-fr="Nom du défi">Challenge Name</label>
        <input id="challenge-name" maxlength="40" class="lang-element" data-placeholder-en="Ex: UTMB 4-Day Challenge" data-placeholder-fr="Ex: Défi UTMB en 4 jours" placeholder="Ex: UTMB 4-Day Challenge">
        
        <label class="lang-element" data-en="Description" data-fr="Description">Description</label>
        <textarea id="description" class="lang-element" data-placeholder-en="Describe your challenge..." data-placeholder-fr="Décrivez votre défi..." placeholder="Describe your challenge..." style="min-height:120px; resize:vertical;"></textarea>
        
        <!-- Visibilité publique/privée -->
        <div style="display: flex; align-items: center; gap: 15px; margin-top: 25px;">
          <label class="switch" style="margin: 0; flex-shrink: 0;">
            <input type="checkbox" id="is-public">
            <span class="slider"></span>
          </label>
          <div style="line-height: 1.4;">
            <strong class="lang-element" data-en="Public Challenge" data-fr="Défi Public" style="display: block; color: var(--color-text-main);">Public Challenge</strong>
            <small class="lang-element" data-en="If unchecked, the challenge remains private." data-fr="Si décoché, le défi reste privé." style="color: var(--color-text-muted);">If unchecked, the challenge remains private.</small>
          </div>
        </div>

        <!-- Image (Admin Only) -->
        <div id="admin-image-section" style="display: none; margin-top: 25px; background: rgba(0,0,0,0.2); padding: 20px; border-radius: 12px; border: 1px dashed rgba(255,255,255,0.2);">
          <label style="margin-top: 0; color: var(--color-accent);">Admin: Image URL (Optional)</label>
          <input id="image-url" type="text" placeholder="https://example.com/image.jpg">
        </div>

        <div class="wizard-nav">
          <button class="btn btn-view-feature lang-element" data-en="Back" data-fr="Précédent" onclick="goToStep(2)">Back</button>
          <button id="publish-btn" class="btn btn-primary lang-element" data-en="Publish challenge" data-fr="Publier le défi" onclick="publishChallenge(event)">Publish challenge</button>
        </div>
      </div>

    </div>
  </div>

  <div id="footer-placeholder"></div>
  <script src="app.js"></script> 
  
  <script>
    let starredSegments = [];
    let segments = [{ id: '', name: '', isValidated: false }, { id: '', name: '', isValidated: false }];
    let dragStartIndex = null;
    let currentStep = 1;

    const isAdmin = localStorage.getItem('is_admin') === 'true'; 
    if (isAdmin) {
      document.getElementById('admin-image-section').style.display = 'block';
    }

    async function fetchStarredSegments() {
      try {
        const res = await fetch('/api/strava?action=getStarredSegments');
        if (res.ok) starredSegments = await res.json();
      } catch (err) { console.error(err); }
    }
    fetchStarredSegments();

    function goToStep(step) {
      const lang = localStorage.getItem('userLang') || 'en';
      
      if (step === 2) {
        const validSegments = segments.filter(s => s.isValidated);
        if (validSegments.length < 2) return alert(lang === 'fr' ? "Vous devez valider au moins 2 segments." : "You must validate at least 2 segments.");
      }
      if (step === 3) {
        const durationStr = document.getElementById("duration").value;
        if (!durationStr || parseInt(durationStr, 10) < 1) return alert(lang === 'fr' ? "Veuillez définir une durée valide." : "Please set a valid duration.");
      }

      document.querySelectorAll('.wizard-step').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.step-dot').forEach(el => el.classList.remove('active'));
      
      document.getElementById(`step-${step}`).classList.add('active');
      for(let i=1; i<=step; i++) {
        document.getElementById(`dot-${i}`).classList.add('active');
      }
      currentStep = step;
    }

    function renderSegments() {
      const list = document.getElementById("segments-list");
      list.innerHTML = "";
      const lang = localStorage.getItem('userLang') || 'en';

      segments.forEach((seg, index) => {
        const row = document.createElement("div");
        row.className = "segment-row";
        row.draggable = true;
        row.dataset.index = index;

        row.addEventListener('dragstart', handleDragStart);
        row.addEventListener('dragover', handleDragOver);
        row.addEventListener('drop', handleDrop);
        row.addEventListener('dragenter', handleDragEnter);
        row.addEventListener('dragleave', handleDragLeave);

        const checkText = lang === 'fr' ? "Valider" : "Check";
        const placeholderText = lang === 'fr' ? "ID ou Favori" : "ID or Favorite";

        let contentHtml = '';
        if (seg.isValidated) {
          contentHtml = `
            <div class="segment-content" style="justify-content: space-between;">
              <div>
                <span style="font-size:1.2rem; color:var(--color-accent); font-weight:800; margin-right:8px;">${index + 1}.</span>
                <strong style="color: var(--color-text-main); font-size: 1.05rem;">${seg.name}</strong> 
                <small style="color:var(--color-text-muted); margin-left:8px;">ID: ${seg.id}</small>
              </div>
              <button onclick="removeOrClearSegment(${index})" style="background:none; border:none; color:var(--danger); font-size:1.8rem; cursor:pointer; transition: transform 0.2s;" onmouseover="this.style.transform='scale(1.2)'" onmouseout="this.style.transform='scale(1)'">×</button>
            </div>`;
        } else {
          contentHtml = `
            <div class="segment-content">
              <span style="font-size:1.2rem; color:var(--color-accent); font-weight:800;">${index + 1}.</span>
              <div class="autocomplete-wrapper" style="flex:1; margin: 0 10px;">
                <input type="text" id="seg-input-${index}" class="segment-input" value="${seg.id}" placeholder="${placeholderText}" oninput="updateSegmentId(${index}, this.value)" autocomplete="off">
                <div class="autocomplete-dropdown"></div>
              </div>
              <button id="btn-val-${index}" onclick="validateSegment(${index})" class="btn btn-primary" style="padding:12px 20px; font-size: 0.9rem;">${checkText}</button>
              <button onclick="removeOrClearSegment(${index})" style="background:none; border:none; color:var(--danger); font-size:1.8rem; cursor:pointer; padding: 0 10px; transition: transform 0.2s;" onmouseover="this.style.transform='scale(1.2)'" onmouseout="this.style.transform='scale(1)'">×</button>
            </div>`;
        }

        row.innerHTML = `<div class="drag-handle">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </div>${contentHtml}`;
        list.appendChild(row);
      });

      document.getElementById("btn-add-row").style.display = segments.length < 5 ? "block" : "none";
    }

    const segmentsListContainer = document.getElementById("segments-list");
    segmentsListContainer.addEventListener('input', function(e) {
      if (e.target.classList.contains('segment-input')) {
        const input = e.target;
        const dropdown = input.nextElementSibling;
        const query = input.value.toLowerCase().trim();
        const index = input.closest('.segment-row').dataset.index;

        if (query.length === 0 || /^\d+$/.test(query)) { dropdown.style.display = 'none'; return; }

        const matches = starredSegments.filter(seg => seg.name.toLowerCase().includes(query));
        dropdown.innerHTML = '';
        if (matches.length > 0) {
          matches.forEach(seg => {
            const item = document.createElement('div');
            item.className = 'autocomplete-item';
            item.innerHTML = `<strong>${seg.name}</strong> <br><small style="color: var(--color-text-muted);">ID: ${seg.id}</small>`;
            item.addEventListener('mousedown', function(event) {
              event.preventDefault(); 
              segments[index] = { id: String(seg.id), name: seg.name, isValidated: true };
              renderSegments(); 
            });
            dropdown.appendChild(item);
          });
        } else {
          dropdown.innerHTML = `<div class="autocomplete-item" style="color:var(--color-text-muted);">Aucun résultat</div>`;
        }
        dropdown.style.display = 'block';
      }
    });

    segmentsListContainer.addEventListener('focusout', function(e) {
      if (e.target.classList.contains('segment-input')) e.target.nextElementSibling.style.display = 'none';
    });

    function updateSegmentId(index, value) { segments[index].id = value; segments[index].isValidated = false; }
    function addEmptySegment() { if (segments.length < 5) { segments.push({ id: '', name: '', isValidated: false }); renderSegments(); } }
    function removeOrClearSegment(index) {
      if (segments.length > 2) segments.splice(index, 1);
      else segments[index] = { id: '', name: '', isValidated: false };
      renderSegments();
    }

    async function validateSegment(index) {
      const id = segments[index].id.trim();
      const btn = document.getElementById(`btn-val-${index}`);
      const input = document.getElementById(`seg-input-${index}`);
      const lang = localStorage.getItem('userLang') || 'en';

      if (!id) return alert(lang === 'fr' ? "Veuillez entrer un ID." : "Please enter an ID.");

      btn.innerHTML = "⏳"; btn.disabled = true; input.disabled = true;

      try {
        const res = await fetch(`/api/strava?action=validateSegment&id=${id}`);
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Segment not found.");
        
        const sportType = (data.activity_type || data.sport || "").toLowerCase();
        if (sportType.includes('virtual') || sportType === 'ebikeride' || sportType === 'rowing') {
            throw new Error(lang === 'fr' ? "Les activités virtuelles ou non-standards ne sont pas autorisées." : "Virtual or non-standard activities are not allowed.");
        }

        segments[index] = { id: id, name: data.name, isValidated: true };
        renderSegments();
      } catch (err) {
        alert(err.message);
        btn.innerHTML = lang === 'fr' ? "Valider" : "Check";
        btn.disabled = false; input.disabled = false;
      }
    }

    function handleDragStart(e) { dragStartIndex = +this.dataset.index; e.dataTransfer.effectAllowed = 'move'; this.classList.add('dragging'); }
    function handleDragOver(e) { e.preventDefault(); return false; }
    function handleDragEnter(e) { this.classList.add('over'); }
    function handleDragLeave(e) { this.classList.remove('over'); }
    function handleDrop(e) {
      e.stopPropagation(); this.classList.remove('over');
      const dragEndIndex = +this.dataset.index;
      if (dragStartIndex !== dragEndIndex && dragStartIndex !== null) {
        const draggedItem = segments.splice(dragStartIndex, 1)[0];
        segments.splice(dragEndIndex, 0, draggedItem);
        renderSegments();
      }
      return false;
    }

    async function publishChallenge(event) {
      if (event) event.preventDefault(); 
      const lang = localStorage.getItem('userLang') || 'en';
      
      const name = document.getElementById("challenge-name").value.trim();
      const description = document.getElementById("description").value.trim();
      const durationStr = document.getElementById("duration").value;
      const strictSequence = document.getElementById("strict-sequence").checked;
      const isPublic = document.getElementById("is-public").checked;
      const imageUrl = document.getElementById("image-url").value.trim();
      
      if (!name) return alert(lang === 'fr' ? "Veuillez donner un nom." : "Please give a name.");
      if (!description) return alert(lang === 'fr' ? "Veuillez ajouter une description." : "Please add a description.");
      
      const validSegments = segments.filter(s => s.isValidated);
      const publishBtn = document.getElementById("publish-btn");
      const originalText = publishBtn.textContent;
      publishBtn.style.pointerEvents = "none";
      publishBtn.textContent = lang === 'fr' ? "Création en cours..." : "Publishing...";

      const urlParams = new URLSearchParams(window.location.search);
      const editId = urlParams.get('edit');
      
      const payload = { 
        name, description, 
        duration: parseInt(durationStr, 10), 
        strict_sequence: strictSequence,
        is_public: isPublic,
        image_url: isAdmin ? imageUrl : null,
        segments: validSegments.map(s => s.id) 
      };

      if (editId) payload.id = editId;
      
      try {
        const res = await fetch("/api/challenges", {
          method: editId ? "PUT" : "POST",
          credentials: "include",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        
        if (!res.ok) {
          alert((lang === 'fr' ? "Erreur : " : "Error: ") + (data.error || "Unable to create challenge."));
          publishBtn.style.pointerEvents = "auto"; publishBtn.textContent = originalText;
          return;
        }
        window.location.href = `/challenge.html?id=${data.id}&autosync=1`;
      } catch (err) {
        alert(lang === 'fr' ? "Erreur réseau." : "Network error.");
        publishBtn.style.pointerEvents = "auto"; publishBtn.textContent = originalText;
      }
    }

    document.addEventListener("DOMContentLoaded", async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const editId = urlParams.get('edit');
      const lang = localStorage.getItem('userLang') || 'en';

      if (editId) {
        document.querySelector('h2').textContent = lang === 'fr' ? "Modifier le défi" : "Edit Challenge";
        document.getElementById('publish-btn').textContent = lang === 'fr' ? "Enregistrer" : "Save changes";
        try {
          const res = await fetch(`/api/challenges?id=${editId}`);
          if (res.ok) {
            const challenge = await res.json();
            document.getElementById("challenge-name").value = challenge.name;
            document.getElementById("description").value = challenge.description;
            document.getElementById("duration").value = challenge.duration_hours;
            document.getElementById("strict-sequence").checked = challenge.strict_sequence;
            document.getElementById("is-public").checked = challenge.is_public;
            if(isAdmin && challenge.image_url) document.getElementById("image-url").value = challenge.image_url;
            
            segments = challenge.segments.map(s => ({ id: String(s.id), name: s.name, isValidated: true }));
            renderSegments();
          }
        } catch (err) { console.error(err); }
      } else {
        renderSegments();
      }
    });
  </script>
</body>
</html>
