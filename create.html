<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <title class="lang-element" data-en="SegSeq - Create Challenge" data-fr="SegSeq - Créer un défi">SegSeq - Create Challenge</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="header-placeholder"></div>

  <div class="container" style="max-width:900px;">
    <div class="form-card">
      <h2 class="lang-element" data-en="Create a Challenge" data-fr="Créer un défi">Create a Challenge</h2>
      
      <label class="lang-element" data-en="Challenge Name" data-fr="Nom du défi">Challenge Name</label>
      <input id="challenge-name" maxlength="40" class="lang-element" data-placeholder-en="Ex: UTMB 4-Day Challenge" data-placeholder-fr="Ex: Défi UTMB en 4 jours" placeholder="Ex: UTMB 4-Day Challenge">
      
      <label class="lang-element" data-en="Description" data-fr="Description">Description</label>
      <textarea id="description" class="lang-element" data-placeholder-en="Describe your challenge..." data-placeholder-fr="Décrivez votre défi..." placeholder="Describe your challenge..." style="min-height:120px; resize:vertical;"></textarea>
      
      <div style="display: flex; gap: 20px;">
        <div style="flex: 1;">
          <label class="lang-element" data-en="Sport" data-fr="Sport">Sport</label>
          <select id="sport">
            <option value="run" class="lang-element" data-en="Running" data-fr="Course à pied">Running</option>
            <option value="ride" class="lang-element" data-en="Cycling" data-fr="Cyclisme">Cycling</option>
          </select>
        </div>
        <div style="flex: 1;">
          <label class="lang-element" data-en="Duration (hours, max 120)" data-fr="Durée (heures, max 120)">Duration (hours, max 120)</label>
          <input id="duration" type="number" min="1" max="120" placeholder="48">
        </div>
      </div>

      <!-- Option de séquence -->
      <div style="display: flex; align-items: center; gap: 15px; margin: 20px 0;">
        <label class="switch">
          <input type="checkbox" id="strict-sequence" checked>
          <span class="slider"></span>
        </label>
        <div>
          <strong class="lang-element" data-en="Strict sequence" data-fr="Séquence stricte" style="display: block; color: var(--navy);">Strict sequence</strong>
          <small class="lang-element" data-en="If enabled, segments must be completed in exact sequence" data-fr="Si activé, les segments doivent être complétés dans l'ordre exact" style="color: #777;">If enabled, segments must be completed in exact sequence</small>
        </div>
      </div>
      
      <label class="lang-element" data-en="Add 2 to 5 Strava segments ID" data-fr="Ajouter de 2 à 5 ID de segments Strava">Add 2 to 5 Strava segments ID</label>
      <div style="display:flex; align-items:center; gap:12px; margin-top:8px;">
        <input id="segment-input" type="number" class="lang-element" data-placeholder-en="Ex: 1234567" data-placeholder-fr="Ex: 1234567" placeholder="Ex: 1234567" style="flex:1;">
        <button id="add-seg-btn" onclick="addSegment()" type="button" style="background:none; border:none; font-size:2rem; color:var(--orange); cursor:pointer; padding:0 10px; width: 50px;">∿</button>
        <span class="lang-element" data-en="Add" data-fr="Ajouter" style="color:#777; font-size:.9rem;">Add</span>
      </div>
      
      <div id="segments" style="margin-top: 20px;"></div>
    </div>
    
    <div class="cta">
      <a href="#" class="btn btn-primary lang-element" data-en="Publish challenge" data-fr="Publier le défi" onclick="publishChallenge()">Publish challenge</a>
      <a href="explore.html" class="btn btn-primary lang-element" data-en="Explore challenges" data-fr="Explorer les défis">Explore challenges</a>
    </div>
  </div>

  <div id="footer-placeholder"></div>

  <!-- Scripts dans le bon ordre -->
  <script src="language.js"></script>
  <script src="components.js"></script>
  
  <script>
    let segments = [];

    async function addSegment() {
      const lang = localStorage.getItem('userLang') || 'en';
      const input = document.getElementById("segment-input");
      const id = input.value.trim();
      const btn = document.getElementById("add-seg-btn");

      // Traductions des alertes
      if (!id) return alert(lang === 'fr' ? "Veuillez entrer un ID de segment." : "Please enter a segment ID.");
      if (segments.length >= 5) return alert(lang === 'fr' ? "Maximum 5 segments autorisés." : "Maximum 5 segments allowed.");

      // UI : Mode chargement
      btn.innerHTML = "⏳";
      btn.disabled = true;
      input.disabled = true;

      try {
        const res = await fetch(`/api/segseq/validate-segment?id=${id}`);
        const data = await res.json();
        
        if (!res.ok) {
            const defaultErr = lang === 'fr' ? "Segment introuvable ou privé sur Strava." : "Segment not found or private on Strava.";
            throw new Error(data.error || defaultErr);
        }
        
        segments.push({ id: id, name: data.name });
        renderSegments();
        input.value = "";
      } catch (err) {
        alert(err.message);
      } finally {
        btn.innerHTML = "∿";
        btn.disabled = false;
        input.disabled = false;
        input.focus();
      }
    }

    function removeSegment(index) {
      segments.splice(index, 1);
      renderSegments();
    }

    function renderSegments() {
      const list = document.getElementById("segments");
      list.innerHTML = "";
      segments.forEach((seg, i) => {
        const item = document.createElement("div");
        item.className = "segment-item";
        item.innerHTML = `
          <div style="display:flex; align-items:center; gap:12px;">
            <span style="font-size:1.2rem; color:var(--orange);">${i + 1}.</span>
            <span><strong>${seg.name}</strong> <br/><small style="color:#777;">ID: ${seg.id}</small></span>
          </div>
          <button onclick="removeSegment(${i})" style="background:none; border:none; color:var(--orange); font-size:1.4rem; cursor:pointer;">×</button>
        `;
        list.appendChild(item);
      });
    }

    async function publishChallenge() {
      const lang = localStorage.getItem('userLang') || 'en';
      const name = document.getElementById("challenge-name").value.trim();
      const description = document.getElementById("description").value.trim();
      const sport = document.getElementById("sport").value;
      const durationStr = document.getElementById("duration").value;
      const strictSequence = document.getElementById("strict-sequence").checked;
      
      // Traductions des alertes de validation
      if (!name) return alert(lang === 'fr' ? "Veuillez donner un nom à votre défi." : "Please give your challenge a name.");
      if (!description) return alert(lang === 'fr' ? "Veuillez ajouter une description." : "Please add a description.");
      if (!durationStr || parseInt(durationStr, 10) < 1) return alert(lang === 'fr' ? "Veuillez définir une durée valide (min 1 heure)." : "Please set a valid duration (min 1 hour).");
      if (segments.length < 2) return alert(lang === 'fr' ? "Vous devez ajouter au moins 2 segments validés." : "You must add at least 2 validated segments.");
      
      const segmentIds = segments.map(s => s.id);
      
      const payload = { 
        name, 
        description, 
        sport, 
        duration: parseInt(durationStr, 10), 
        strict_sequence: strictSequence,
        segments: segmentIds 
      };
      
      try {
        const res = await fetch("/api/segseq/challenges", {
          method: "POST",
          credentials: "include",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        
        if (!res.ok) {
          const errorPrefix = lang === 'fr' ? "Erreur : " : "Error: ";
          const defaultError = lang === 'fr' ? "Impossible de créer le défi." : "Unable to create challenge.";
          alert(errorPrefix + (data.error || defaultError));
          return;
        }
        
        window.location.href = `/challenge.html?id=${data.id}&force=1`;
      } catch (err) {
        console.error(err);
        alert(lang === 'fr' ? "Erreur réseau. Veuillez vérifier votre connexion." : "Network error. Please check your connection.");
      }
    }
  </script>
</body>
</html>
