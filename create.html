<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <title class="lang-element" data-en="SegSeq - Create Challenge" data-fr="SegSeq - Créer un défi">SegSeq - Create Challenge</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="header-placeholder"></div>

  <div class="container" style="max-width:900px;">
    <div class="form-card">
      <h2 class="lang-element" data-en="Create a Challenge" data-fr="Créer un défi">Create a Challenge</h2>
      
      <label class="lang-element" data-en="Challenge Name" data-fr="Nom du défi">Challenge Name</label>
      <input id="challenge-name" maxlength="40" class="lang-element" data-placeholder-en="Ex: UTMB 4-Day Challenge" data-placeholder-fr="Ex: Défi UTMB en 4 jours" placeholder="Ex: UTMB 4-Day Challenge">
      
      <label class="lang-element" data-en="Description" data-fr="Description">Description</label>
      <textarea id="description" class="lang-element" data-placeholder-en="Describe your challenge..." data-placeholder-fr="Décrivez votre défi..." placeholder="Describe your challenge..." style="min-height:120px; resize:vertical;"></textarea>
      
      <!-- Bloc Durée + Séquence aligné -->
      <div class="mobile-stack" style="display: flex; gap: 30px; margin-top: 20px;">
        
        <!-- Colonne Gauche : Durée -->
        <div style="flex: 1;">
          <label class="lang-element" data-en="Duration (hours, max 120)" data-fr="Durée (heures, max 120)" style="margin-top: 0;">Duration (hours, max 120)</label>
          <input id="duration" type="number" min="1" max="120" placeholder="48">
        </div>

        <!-- Colonne Droite : Séquence -->
        <div style="flex: 1; display: flex; align-items: center;">
          <!-- Le margin-top: 28px permet d'aligner le switch exactement au niveau de l'input -->
          <div style="display: flex; align-items: center; gap: 15px; margin-top: 28px;">
            <label class="switch" style="margin: 0; flex-shrink: 0;">
              <input type="checkbox" id="strict-sequence" checked>
              <span class="slider"></span>
            </label>
            <div style="line-height: 1.3;">
              <strong class="lang-element" data-en="Strict sequence" data-fr="Séquence stricte" style="display: block; color: var(--navy);">Strict sequence</strong>
              <small class="lang-element" data-en="Segments must be completed in exact order" data-fr="Les segments doivent être complétés dans l'ordre exact" style="color: #777;">Segments must be completed in exact order</small>
            </div>
          </div>
        </div>

      </div>
      
      <label class="lang-element" data-en="Segments (Drag to reorder)" data-fr="Segments (Glissez pour réorganiser)" style="margin-top: 30px;">Segments (Drag to reorder)</label>
      
      <!-- Conteneur de la liste glisser-déposer -->
      <div id="segments-list" style="margin-top: 10px;"></div>
      
      <!-- Bouton pour ajouter une 3e, 4e ou 5e ligne -->
      <button id="btn-add-row" class="btn-add-row" onclick="addEmptySegment()">
        + <span class="lang-element" data-en="Add another segment" data-fr="Ajouter un autre segment">Add another segment</span>
      </button>
    </div>
    
    <div class="cta">
      <a href="#" id="publish-btn" class="btn btn-primary lang-element" data-en="Publish challenge" data-fr="Publier le défi" onclick="publishChallenge(event)">Publish challenge</a>
      <a href="explore.html" class="btn btn-primary lang-element" data-en="Explore challenges" data-fr="Explorer les défis">Explore challenges</a>
    </div>
  </div>

  <div id="footer-placeholder"></div>

  <!-- Scripts dans le bon ordre -->
  <script src="language.js"></script>
  <script src="components.js"></script>
  
  <script>
  // État initial : 2 lignes vides par défaut
    let segments = [
      { id: '', name: '', isValidated: false },
      { id: '', name: '', isValidated: false }
    ];

    let dragStartIndex = null;

    // --- FONCTIONS D'AFFICHAGE ---
    function renderSegments() {
      const list = document.getElementById("segments-list");
      list.innerHTML = "";
      const lang = localStorage.getItem('userLang') || 'en';

      segments.forEach((seg, index) => {
        const row = document.createElement("div");
        row.className = "segment-row";
        row.draggable = true;
        row.dataset.index = index;

        // Événements Drag & Drop
        row.addEventListener('dragstart', handleDragStart);
        row.addEventListener('dragover', handleDragOver);
        row.addEventListener('drop', handleDrop);
        row.addEventListener('dragenter', handleDragEnter);
        row.addEventListener('dragleave', handleDragLeave);

        const checkText = lang === 'fr' ? "Valider" : "Check";
        const placeholderText = lang === 'fr' ? "ID du Segment (ex: 123456)" : "Segment ID (ex: 123456)";

        let contentHtml = '';
        
        // Si le segment est validé (on affiche le nom)
        if (seg.isValidated) {
          contentHtml = `
            <div class="segment-content" style="justify-content: space-between;">
              <div>
                <span style="font-size:1.2rem; color:var(--orange); font-weight:bold; margin-right:8px;">${index + 1}.</span>
                <strong style="color: var(--navy);">${seg.name}</strong> <small style="color:#777; margin-left:8px;">ID: ${seg.id}</small>
              </div>
              <button onclick="removeOrClearSegment(${index})" style="background:none; border:none; color:var(--danger); font-size:1.5rem; cursor:pointer;" title="Remove">×</button>
            </div>
          `;
        } 
        // Si le segment est vide ou non validé (on affiche l'input)
        else {
          contentHtml = `
            <div class="segment-content">
              <span style="font-size:1.2rem; color:var(--orange); font-weight:bold;">${index + 1}.</span>
              <input type="number" id="seg-input-${index}" value="${seg.id}" placeholder="${placeholderText}" oninput="updateSegmentId(${index}, this.value)" style="flex:1;">
              <button id="btn-val-${index}" onclick="validateSegment(${index})" class="btn btn-primary" style="padding:12px 20px;">${checkText}</button>
              <button onclick="removeOrClearSegment(${index})" style="background:none; border:none; color:var(--danger); font-size:1.5rem; cursor:pointer; padding: 0 10px;" title="Remove">×</button>
            </div>
          `;
        }

        // Icône Grip (6 points) conventionnelle pour le Drag & Drop
        row.innerHTML = `
          <div class="drag-handle" title="Drag to reorder">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="9" cy="12" r="1.5"></circle><circle cx="9" cy="5" r="1.5"></circle><circle cx="9" cy="19" r="1.5"></circle>
              <circle cx="15" cy="12" r="1.5"></circle><circle cx="15" cy="5" r="1.5"></circle><circle cx="15" cy="19" r="1.5"></circle>
            </svg>
          </div>
          ${contentHtml}
        `;
        list.appendChild(row);
      });

      // Gérer l'affichage du bouton "Ajouter une ligne" (Max 5)
      document.getElementById("btn-add-row").style.display = segments.length < 5 ? "block" : "none";
    }

    // --- FONCTIONS LOGIQUES ---
    function updateSegmentId(index, value) {
      segments[index].id = value;
      segments[index].isValidated = false;
    }

    function addEmptySegment() {
      if (segments.length < 5) {
        segments.push({ id: '', name: '', isValidated: false });
        renderSegments();
      }
    }

    function removeOrClearSegment(index) {
      if (segments.length > 2) {
        segments.splice(index, 1); // Supprime la ligne si on en a plus de 2
      } else {
        segments[index] = { id: '', name: '', isValidated: false }; // Vide la ligne si on est au minimum de 2
      }
      renderSegments();
    }

    async function validateSegment(index) {
      const id = segments[index].id.trim();
      const btn = document.getElementById(`btn-val-${index}`);
      const input = document.getElementById(`seg-input-${index}`);
      const lang = localStorage.getItem('userLang') || 'en';

      if (!id) return alert(lang === 'fr' ? "Veuillez entrer un ID." : "Please enter an ID.");

      btn.innerHTML = "⏳";
      btn.disabled = true;
      input.disabled = true;

      try {
        const res = await fetch(`/api/segseq/validate-segment?id=${id}`);
        const data = await res.json();
        
        if (!res.ok) throw new Error(data.error || (lang === 'fr' ? "Segment introuvable." : "Segment not found."));
        
        segments[index] = { id: id, name: data.name, isValidated: true };
        renderSegments();
      } catch (err) {
        alert(err.message);
        btn.innerHTML = lang === 'fr' ? "Valider" : "Check";
        btn.disabled = false;
        input.disabled = false;
      }
    }

    // --- LOGIQUE DRAG & DROP ---
    function handleDragStart(e) {
      dragStartIndex = +this.dataset.index;
      e.dataTransfer.effectAllowed = 'move';
      this.classList.add('dragging');
    }

    function handleDragOver(e) {
      e.preventDefault(); // Nécessaire pour autoriser le drop
      return false;
    }

    function handleDragEnter(e) {
      this.classList.add('over');
    }

    function handleDragLeave(e) {
      this.classList.remove('over');
    }

    function handleDrop(e) {
      e.stopPropagation();
      this.classList.remove('over');
      const dragEndIndex = +this.dataset.index;
      
      if (dragStartIndex !== dragEndIndex && dragStartIndex !== null) {
        // Déplace l'élément dans le tableau
        const draggedItem = segments.splice(dragStartIndex, 1)[0];
        segments.splice(dragEndIndex, 0, draggedItem);
        renderSegments();
      }
      return false;
    }

    // --- SOUMISSION FINALE ---
    async function publishChallenge(event) {
      if (event) event.preventDefault(); 
      const lang = localStorage.getItem('userLang') || 'en';
      
      const name = document.getElementById("challenge-name").value.trim();
      const description = document.getElementById("description").value.trim();
      const durationStr = document.getElementById("duration").value;
      const strictSequence = document.getElementById("strict-sequence").checked;
      
      // Vérifications globales
      if (!name) return alert(lang === 'fr' ? "Veuillez donner un nom à votre défi." : "Please give your challenge a name.");
      if (!description) return alert(lang === 'fr' ? "Veuillez ajouter une description." : "Please add a description.");
      if (!durationStr || parseInt(durationStr, 10) < 1) return alert(lang === 'fr' ? "Veuillez définir une durée valide (min 1 heure)." : "Please set a valid duration (min 1 hour).");
      
      // Vérification des segments (tous doivent être validés)
      const validSegments = segments.filter(s => s.isValidated);
      if (validSegments.length < 2) return alert(lang === 'fr' ? "Vous devez valider au moins 2 segments." : "You must validate at least 2 segments.");
      if (validSegments.length !== segments.length) return alert(lang === 'fr' ? "Veuillez valider ou supprimer les lignes de segments vides." : "Please validate or remove empty segment rows.");
      
      const publishBtn = document.getElementById("publish-btn");
      const originalText = publishBtn.textContent;
      publishBtn.style.pointerEvents = "none";
      publishBtn.textContent = lang === 'fr' ? "Création en cours..." : "Publishing...";

      const segmentIds = validSegments.map(s => s.id);
      
      const payload = { 
        name, 
        description, 
        duration: parseInt(durationStr, 10), 
        strict_sequence: strictSequence,
        segments: segmentIds 
      };
      
      try {
        const res = await fetch("/api/segseq/challenges", {
          method: "POST",
          credentials: "include",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        
        if (!res.ok) {
          alert((lang === 'fr' ? "Erreur : " : "Error: ") + (data.error || "Unable to create challenge."));
          publishBtn.style.pointerEvents = "auto";
          publishBtn.textContent = originalText;
          return;
        }
        
        window.location.href = `/challenge.html?id=${data.id}&force=1`;
        
      } catch (err) {
        console.error(err);
        alert(lang === 'fr' ? "Erreur réseau." : "Network error.");
        publishBtn.style.pointerEvents = "auto";
        publishBtn.textContent = originalText;
      }
    }

    // Initialisation au chargement de la page
    document.addEventListener("DOMContentLoaded", renderSegments);
  </script>
</body>
</html>
