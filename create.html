<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SegSeq - Create Challenge</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="header-placeholder"></div>

  <div class="container" style="max-width:900px;">
    <div class="form-card">
      <h2>Create a Challenge</h2>
      
      <label>Challenge Name</label>
      <input id="challenge-name" maxlength="40" placeholder="Ex: UTMB 4-Day Challenge">
      
      <label>Description</label>
      <textarea id="description" placeholder="Describe your challenge..." style="min-height:120px; resize:vertical;"></textarea>
      
      <div style="display: flex; gap: 20px;">
        <div style="flex: 1;">
          <label>Sport</label>
          <select id="sport">
            <option value="run">Running</option>
            <option value="ride">Cycling</option>
          </select>
        </div>
        <div style="flex: 1;">
          <label>Duration (hours, max 120)</label>
          <input id="duration" type="number" min="1" max="120" placeholder="48">
        </div>
      </div>

      <!-- NOUVEAU : Option de séquence -->
      <label>Ordre des segments</label>
      <select id="strict-sequence">
        <option value="true">Séquence stricte (Ordre obligatoire)</option>
        <option value="false">Ordre libre (N'importe quel ordre)</option>
      </select>
      
      <label>Add 2 to 5 Strava segments ID</label>
      <div style="display:flex; align-items:center; gap:12px; margin-top:8px;">
        <input id="segment-input" type="number" placeholder="Ex: 1234567" style="flex:1;">
        <button id="add-seg-btn" onclick="addSegment()" type="button" style="background:none; border:none; font-size:2rem; color:var(--orange); cursor:pointer; padding:0 10px; width: 50px;">∿</button>
        <span style="color:#777; font-size:.9rem;">Add</span>
      </div>
      
      <div id="segments" style="margin-top: 20px;"></div>
    </div>
    
    <div class="cta">
      <a href="#" class="btn btn-primary" onclick="publishChallenge()">Publish challenge</a>
      <a href="explore.html" class="btn btn-primary">Explore challenges</a>
    </div>
  </div>

  <div id="footer-placeholder"></div>

  <script src="components.js"></script>
  <script>
    // On stocke maintenant des objets {id, name} au lieu de juste l'ID
    let segments = [];

    async function addSegment() {
      const input = document.getElementById("segment-input");
      const id = input.value.trim();
      const btn = document.getElementById("add-seg-btn");

      // Validations de base
      if (!id) return alert("Veuillez entrer un ID de segment.");
      if (segments.length >= 5) return alert("Maximum 5 segments autorisés.");
      if (segments.some(s => s.id === id)) return alert("Ce segment est déjà dans la liste.");

      // UI : Mode chargement
      btn.innerHTML = "⏳";
      btn.disabled = true;
      input.disabled = true;

      try {
        // Appel au backend pour valider le segment via l'API Strava
        const res = await fetch(`/api/segseq/validate-segment?id=${id}`);
        const data = await res.json();
        
        if (!res.ok) throw new Error(data.error || "Segment introuvable ou privé sur Strava.");
        
        // Succès : on ajoute le segment avec son vrai nom Strava
        segments.push({ id: id, name: data.name });
        renderSegments();
        input.value = "";
      } catch (err) {
        alert(err.message);
      } finally {
        // UI : Retour à la normale
        btn.innerHTML = "∿";
        btn.disabled = false;
        input.disabled = false;
        input.focus();
      }
    }

    function removeSegment(index) {
      segments.splice(index, 1);
      renderSegments();
    }

    function renderSegments() {
      const list = document.getElementById("segments");
      list.innerHTML = "";
      segments.forEach((seg, i) => {
        const item = document.createElement("div");
        item.className = "segment-item";
        item.innerHTML = `
          <div style="display:flex; align-items:center; gap:12px;">
            <span style="font-size:1.2rem; color:var(--orange);">${i + 1}.</span>
            <span><strong>${seg.name}</strong> <br/><small style="color:#777;">ID: ${seg.id}</small></span>
          </div>
          <button onclick="removeSegment(${i})" style="background:none; border:none; color:var(--orange); font-size:1.4rem; cursor:pointer;">×</button>
        `;
        list.appendChild(item);
      });
    }

    async function publishChallenge() {
      const name = document.getElementById("challenge-name").value.trim();
      const description = document.getElementById("description").value.trim();
      const sport = document.getElementById("sport").value;
      const durationStr = document.getElementById("duration").value;
      const strictSequence = document.getElementById("strict-sequence").value === "true";
      
      // 2a) Validations précises
      if (!name) return alert("Veuillez donner un nom à votre challenge.");
      if (!description) return alert("Veuillez ajouter une description.");
      if (!durationStr || parseInt(durationStr, 10) < 1) return alert("Veuillez définir une durée valide (min 1 heure).");
      if (segments.length < 2) return alert("Vous devez ajouter au moins 2 segments validés.");
      
      // On ne renvoie que les IDs au backend pour ne pas casser ton API existante
      const segmentIds = segments.map(s => s.id);
      
      const payload = { 
        name, 
        description, 
        sport, 
        duration: parseInt(durationStr, 10), 
        strict_sequence: strictSequence, // Nouvelle donnée
        segments: segmentIds 
      };
      
      try {
        const res = await fetch("/api/segseq/challenges", {
          method: "POST",
          credentials: "include",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        
        if (!res.ok) {
          // 2b) Si le backend renvoie une erreur (ex: Nom déjà pris)
          alert("Erreur: " + (data.error || "Impossible de créer le challenge."));
          return;
        }
        // Succès !
        window.location.href = `/challenge.html?id=${data.id}&force=1`;
      } catch (err) {
        console.error(err);
        alert("Erreur réseau. Veuillez vérifier votre connexion.");
      }
    }
  </script>
</body>
</html>
