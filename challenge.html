<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SegSeq - Challenge</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="header-placeholder"></div>

  <div class="container" style="max-width:900px;">
    <div class="card">
      <h2 id="challenge-name" style="font-size: 2rem; margin-bottom: 20px;">Loading...</h2>
      <p id="challenge-description" style="opacity:.8; line-height:1.6; margin-bottom: 30px;">Loading description...</p>
      
      <h3 style="color:var(--navy); margin-bottom: 10px;">Details</h3>
      <p><strong>Sport:</strong> <span id="challenge-sport"></span></p>
      <p><strong>Duration:</strong> <span id="challenge-duration"></span> hours</p>
      <p><strong>Distance:</strong> <span id="challenge-distance"></span> km</p>
      <p><strong>Elevation:</strong> <span id="challenge-elevation"></span> m</p>
      
      <h3 style="color:var(--navy); margin: 30px 0 10px;">Segments</h3>
      <div id="segments-list"></div>
      
      <h3 style="color:var(--navy); margin: 30px 0 10px;">Logic Execution Log</h3>
      <div id="debug-log" class="debug-console">Awaiting execution...</div>
      
      <h3 style="color:var(--navy); margin: 30px 0 10px;">Leaderboard</h3>
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Athlete</th>
            <th>Date</th>
            <th>Total Time</th>
            <th>Moving Time</th>
          </tr>
        </thead>
        <tbody id="leaderboard"></tbody>
      </table>
      
	  <div class="refresh-container">
  <button id="refresh-btn" class="btn-refresh" title="Force synchro with Strava & Recalculate">
    <svg id="refresh-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="23 4 23 10 17 10"></polyline>
      <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
    </svg>
  </button>
</div>
    </div>
    
    <div class="cta">
      <a href="create.html" class="btn btn-primary">Create a challenge</a>
      <a href="explore.html" class="btn btn-primary" style="margin-left: 10px;">Explore challenges</a>
    </div>
  </div>

  <div id="footer-placeholder"></div>

  <script src="components.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const challengeId = params.get("id");

    function renderLeaderboardData(lbData) {
      const debugLog = document.getElementById("debug-log");
      if (lbData.debug_steps) {
        debugLog.innerHTML = lbData.debug_steps.join("<br/>");
        debugLog.scrollTop = debugLog.scrollHeight;
      }
      const lb = document.getElementById("leaderboard");
      lb.innerHTML = "";
      
      if (lbData.leaderboard && lbData.leaderboard.length > 0) {
        lbData.leaderboard.forEach(row => {
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td>${row.rank}</td>
            <td>${row.athlete}</td>
            <td>${row.start_date}</td>
            <td>${row.total_time_human}</td>
            <td><strong style="color:var(--orange);">${row.moving_time_human}</strong></td>
          `;
          lb.appendChild(tr);
        });
      } else {
        lb.innerHTML = `<tr><td colspan="5" style="text-align:center;">No valid completions found.</td></tr>`;
      }
    }

    async function loadChallenge() {
      try {
        const res = await fetch(`/api/segseq/challenge?id=${challengeId}`);
        const data = await res.json();
        
        if (!res.ok) {
          document.getElementById("challenge-name").textContent = "Error loading challenge";
          return;
        }
        
        document.getElementById("challenge-name").textContent = data.name;
        document.getElementById("challenge-description").textContent = data.description;
        document.getElementById("challenge-sport").textContent = data.sport;
        document.getElementById("challenge-duration").textContent = data.duration;
        document.getElementById("challenge-distance").textContent = (data.total_distance / 1000).toFixed(2);
        document.getElementById("challenge-elevation").textContent = Math.round(data.total_elevation);
        
        const segList = document.getElementById("segments-list");
        segList.innerHTML = "";
        data.segments.forEach(seg => {
          const div = document.createElement("div");
          div.className = "segment-item";
          const displayName = seg.name ? seg.name : `Segment #${seg.id}`;
          const details = seg.distance ? `(${(seg.distance / 1000).toFixed(2)} km, +${Math.round(seg.elevation)} m)` : '';
          
          div.innerHTML = `
            <div style="display:flex; align-items:center; gap:12px;">
              <span style="font-size:1.2rem; color:var(--orange);">${seg.order}.</span>
              <span><strong>${displayName}</strong> <br/><small style="color:#777;">${details}</small></span>
            </div>
            <a href="https://www.strava.com/segments/${seg.id}" target="_blank" rel="noopener noreferrer" class="btn-view-feature">View on Strava</a>
          `;
          segList.appendChild(div);
        });

        const autoSync = params.get("autosync");
        if (autoSync === "1") {
          document.getElementById("refresh-btn").click();
          window.history.replaceState({}, document.title, `/Challenge.html?id=${challengeId}`);
        } else {
          const lbRes = await fetch(`/api/segseq/leaderboard?id=${challengeId}`);
          const lbData = await lbRes.json();
          renderLeaderboardData(lbData);
        }
      } catch (err) {
        console.error(err);
      }
    }
    loadChallenge();

    document.getElementById("refresh-btn").addEventListener("click", async () => {
      const lb = document.getElementById("leaderboard");
      const debugLog = document.getElementById("debug-log");
      const icon = document.getElementById("refresh-icon"); // On cible l'icône
      
      icon.classList.add("spinning"); // Démarre l'animation
      lb.innerHTML = `<tr><td colspan="5" style="text-align:center;">Refreshing from Strava API... Please wait.</td></tr>`;
      debugLog.innerHTML = "> Initiating Force Sync with Strava API...<br/>> This may take a few seconds...";
      
      try {
        const lbRes = await fetch(`/api/segseq/leaderboard?id=${challengeId}&force=1`);
        const lbData = await lbRes.json();
        if(!lbRes.ok) {
          debugLog.innerHTML += `<br/><span style="color:red">> Error: ${lbData.error}</span>`;
          icon.classList.remove("spinning"); // Arrête l'animation en cas d'erreur
          return;
        }
        renderLeaderboardData(lbData);
      } catch (err) {
        console.error(err);
      } finally {
        icon.classList.remove("spinning"); // Arrête l'animation quand c'est fini
      }
    });
  </script>
</body>
</html>
