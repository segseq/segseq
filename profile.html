<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>SegSeq - Welcome</title>

<style>

:root{
  --navy:#072B57;
  --navy-light:#0E487D;
  --orange:#FF6B1A;
  --white:#FFFFFF;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Inter,sans-serif;
  background:var(--navy);
  color:white;
  min-height:100vh;
}

.container{
  max-width:900px;
  margin:auto;
  padding:40px 20px;
}

.hero{
  text-align:center;
  margin-bottom:50px;
}

.brand{
  font-size:4rem;
  font-weight:800;
  letter-spacing:-2px;
}

.brand .accent{
  color:var(--orange);
}

.subtitle{
  margin-top:20px;
  font-size:1.2rem;
  opacity:.85;
}

.profile-card{
  background:white;
  color:#222;
  border-radius:24px;
  padding:40px;
  box-shadow:0 20px 60px rgba(0,0,0,.30);
}

.profile-header{
  text-align:center;
  margin-bottom:40px;
}

.profile-photo{
  width:140px;
  height:140px;
  border-radius:50%;
  border:6px solid var(--orange);
  object-fit:cover;
}

.welcome{
  margin-top:20px;
  font-size:2rem;
  color:var(--navy);
  font-weight:800;
}

.info-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:20px;
}

.info-box{
  background:#F5F8FC;
  border-radius:16px;
  padding:24px;
}

.label{
  font-size:.9rem;
  text-transform:uppercase;
  letter-spacing:.5px;
  color:#777;
  margin-bottom:8px;
}

.value{
  font-size:1.3rem;
  font-weight:700;
  color:var(--navy);
}

.cta{
  text-align:center;
  margin-top:40px;
}

.btn{
  display:inline-block;
  background:var(--orange);
  color:white;
  padding:16px 32px;
  border-radius:12px;
  text-decoration:none;
  font-weight:700;
  transition:.2s;
}

.btn:hover{
  transform:translateY(-2px);
}

footer{
  text-align:center;
  margin-top:50px;
  opacity:.7;
}

@media(max-width:768px){

  .brand{
    font-size:3rem;
  }

  .info-grid{
    grid-template-columns:1fr;
  }

}

</style>
</head>

<body>

<div class="container">

  <div class="hero">
    <h1 class="brand">
      Seg<span class="accent">S</span>eq
    </h1>

    <p class="subtitle">
      Complete the Sequence. Own the Leaderboard.
    </p>
  </div>

  <div class="profile-card">

    <div class="profile-header">

      <img
        id="athlete-photo"
        class="profile-photo"
        src="https://via.placeholder.com/140"
        alt="Athlete photo"
      >

      <div class="welcome" id="welcome">
		Welcome back
	   </div>

	  <div class="info-grid">

  <div class="info-box">
    <div class="label">Name</div>
    <div class="value" id="name">Loading...</div>
  </div>

  <div class="info-box">
    <div class="label">City</div>
    <div class="value" id="city">Loading...</div>
  </div>

  <div class="info-box">
    <div class="label">Country</div>
    <div class="value" id="country">Loading...</div>
  </div>

  <div class="info-box">
    <div class="label">Followers</div>
    <div class="value" id="followers">Loading...</div>
  </div>

  <div class="info-box">
    <div class="label">Activities</div>
    <div class="value" id="activities">Loading...</div>
  </div>

</div>

    </div>

    <div class="cta">
       Continue to SegSeq
      </a>
    </div>

  </div>

<footer>

<div class="logo">
<span>∿</span>∿
</div>

SegSeq • Multi-Segment Challenges

</footer>

</div>

<script>
async function loadProfile() {
  try {
    const res = await fetch("https://segseq-backend.vercel.app/api/strava/me", {
  credentials: "include"
});

    if (!res.ok) {
      document.getElementById("welcome").textContent = "Not authenticated";
      return;
    }

    const athlete = await res.json();

    // Photo
    document.getElementById("athlete-photo").src = athlete.profile;

    // Welcome message
    document.getElementById("welcome").textContent =
      `Welcome back, ${athlete.firstname}!`;

    // Info boxes
    document.getElementById("name").textContent =
      athlete.firstname + " " + athlete.lastname;

    document.getElementById("city").textContent = athlete.city || "N/A";
    document.getElementById("country").textContent = athlete.country || "N/A";

    document.getElementById("followers").textContent =
      athlete.follower_count || 0;

    document.getElementById("activities").textContent =
      athlete.resource_state || "N/A"; // Strava ne donne pas le total ici
  } catch (err) {
    console.error(err);
  }
}

loadProfile();
</script>


</body>
</html>
