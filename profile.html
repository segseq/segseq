<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SegSeq - Profile</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="header-placeholder"></div>

  <div class="container" style="max-width:900px;">
    <div class="profile-card">
      <div style="text-align:center; margin-bottom:40px;">
        <img id="athlete-photo" class="profile-photo" src="https://via.placeholder.com/140" alt="Athlete photo">
        <div id="welcome" style="margin-top:20px; font-size:2rem; color:var(--navy); font-weight:800;">Loading...</div>
      </div>
      <div class="info-grid">
        <div class="info-box">
          <div style="font-size:.9rem; text-transform:uppercase; color:#777; margin-bottom:8px;">Name</div>
          <div id="name" style="font-size:1.3rem; font-weight:700; color:var(--navy);">Loading...</div>
        </div>
        <div class="info-box">
          <div style="font-size:.9rem; text-transform:uppercase; color:#777; margin-bottom:8px;">Country</div>
          <div id="country" style="font-size:1.3rem; font-weight:700; color:var(--navy);">Loading...</div>
        </div>
      </div>
    </div>

    <div class="cta">
      <a href="Create.html" class="btn btn-primary">Create a challenge</a>
      <a href="Explore.html" class="btn btn-primary" style="margin-left: 10px;">Explore challenges</a>
    </div>
  </div>

  <div id="footer-placeholder"></div>

  <script src="components.js"></script>
  <script>
    async function loadProfile() {
      try {
        const athleteRes = await fetch("/api/strava/me", { credentials: "include" });
        if (!athleteRes.ok) {
          document.getElementById("welcome").textContent = "Not authenticated";
          return;
        }
        const athlete = await athleteRes.json();
        document.getElementById("athlete-photo").src = athlete.profile;
        document.getElementById("welcome").textContent = `Welcome back, ${athlete.firstname}!`;
        document.getElementById("name").textContent = athlete.firstname + " " + athlete.lastname;
        document.getElementById("country").textContent = athlete.country || "N/A";
      } catch (err) {
        console.error(err);
      }
    }
    loadProfile();
  </script>
</body>
</html>
